# Netlify settings for the PC-Spain website.
# The site is plain HTML/CSS/JS that is already built into the pc-spain/ folder,
# so Netlify only has to publish that folder – no build step.
[build]
  base = "pc-spain"
  publish = "."
  command = "echo 'Static site - nothing to build'"

# Fonts have unique file names, so browsers may keep them for a year.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images and videos rarely change: cache for a week.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Basic security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
